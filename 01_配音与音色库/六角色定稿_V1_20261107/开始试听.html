<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六角色定稿</title><style>body{background:#f5f3ef;color:#242824;font:16px/1.7 system-ui,'Microsoft YaHei',sans-serif;margin:0}main{max-width:950px;margin:auto;padding:32px 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}article{background:white;border:1px solid #ddd9ce;border-radius:12px;padding:18px}h2{font-size:20px;margin-top:0}audio{width:350px;max-width:100%}</style><main><h1>六个角色，音色已定</h1><p>男宝A、爸爸B、奶奶B；女宝和妈妈沿用原音色；爷爷使用免费A。这些是已选音色的试听样本，整套台词尚未重新生成。</p><div class="grid"><article><h2>男宝 · A</h2><audio controls preload="none" src="%E5%B7%B2%E9%80%89%E6%A0%B7%E6%9C%AC/%E7%94%B7%E5%AE%9D.mp3"></audio></article><article><h2>女宝 · 原音色</h2><audio controls preload="none" src="%E5%B7%B2%E9%80%89%E6%A0%B7%E6%9C%AC/%E5%A5%B3%E5%AE%9D.mp3"></audio></article><article><h2>爸爸 · B</h2><audio controls preload="none" src="%E5%B7%B2%E9%80%89%E6%A0%B7%E6%9C%AC/%E7%88%B8%E7%88%B8.mp3"></audio></article><article><h2>妈妈 · 原音色</h2><audio controls preload="none" src="%E5%B7%B2%E9%80%89%E6%A0%B7%E6%9C%AC/%E5%A6%88%E5%A6%88.mp3"></audio></article><article><h2>爷爷 · 免费A</h2><audio controls preload="none" src="%E5%B7%B2%E9%80%89%E6%A0%B7%E6%9C%AC/%E7%88%B7%E7%88%B7.mp3"></audio></article><article><h2>奶奶 · B</h2><audio controls preload="none" src="%E5%B7%B2%E9%80%89%E6%A0%B7%E6%9C%AC/%E5%A5%B6%E5%A5%B6.mp3"></audio></article></div><p>爷爷走Edge，不调用MiniMax。其余五位新台词仍按字计费；本次没有新增付费调用。</p><script>document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true)</script></main></html>
