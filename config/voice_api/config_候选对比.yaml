# ============================================================
# 候选音色对比包（2026-11-10）
# 目的：同一角色多音色横向对比，供人工试听定夺
# 说明：密钥不写在这里，运行前用环境变量 MINIMAX_API_KEY 传入
#       （环境变量优先级高于配置文件，见 config/voice_api/config.yaml）
# 每个角色两条场景：
#   候选对照_<角色> —— 同一句台词、同一情绪参数，只变音色，用于纯音色比对
#   候选情景_<角色> —— 同一角色典型情景台词，用于听语气与情绪是否成立
# ============================================================

api_key: ""

base_url: "https://api.minimaxi.com"
model: "speech-2.8-hd"
language_boost: "auto"
timeout_seconds: 90
request_interval_seconds: 1.3
max_retries: 4

audio_setting:
  sample_rate: 32000
  bitrate: 128000
  format: "mp3"
  channel: 1

output_dir: "候选音色对比_20261110"
full_name: ""

# 角色基准（仅用于显示与默认参数，候选行会逐条覆盖音色）
